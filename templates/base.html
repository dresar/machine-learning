<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}ML Dashboard{% endblock %}</title>
  <!-- Bootstrap 5.3 (Cloudflare CDN - stable) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f7f7fb; }
    pre { background:#0b1020; color:#d7e0ff; padding:12px; border-radius:8px; overflow:auto; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'dashboard' %}">ML Dashboard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'dataset' %}">Dataset</a></li>
        </ul>
        <div class="d-flex">
          {% if user.is_authenticated %}
            <span class="badge text-bg-light me-2">Hi, {{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-outline-light">Logout</a>
          {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-light">Login</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
