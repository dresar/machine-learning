{% extends 'base.html' %}
{% block title %}Dataset Latihan{% endblock %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h2 class="h4">Dataset Latihan (Dummy Cuaca)</h2>
          <p class="text-muted">Dataset kecil untuk demonstrasi preprocessing dan training.</p>
          <div class="table-responsive">
            {{ table_html|safe }}
          </div>
          <div class="mt-3 d-flex gap-2">
            <a class="btn btn-primary" href="{% url 'dashboard' %}">Kembali ke Dashboard</a>
            <a class="btn btn-outline-secondary" href="{% load static %}{% static 'data/dummy_weather.csv' %}" download>Unduh CSV</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
